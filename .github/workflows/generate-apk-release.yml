name: Release OSS (APK)

on:
  push:
    tags:
      - v*

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust/.cargo/config.toml') }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.89.0
          components: rustfmt

      - name: Create Secrets file
        run: |
          # 直接用模板生成 secrets.dart（8 个空常量）
          # 没有 SECRETS 时 OAuth 登录禁用，但 HTTP/SSH 推送不受影响
          cp ./lib/constant/secrets.dart.template ./lib/constant/secrets.dart
          echo "Created secrets.dart from template (OAuth disabled, HTTP/SSH works)"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.2

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install cargo-expand
        run: cargo install cargo-expand --version 1.0.121 --locked

      - name: Get Packages
        run: flutter pub get

      - name: Generate Rust
        run: |
          flutter_rust_bridge_codegen generate

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29-beta4

      - uses: SimonMarquis/android-accept-licenses@v1

      - name: Build Release APKs
        run: |
          export CARGO_ENCODED_RUSTFLAGS=$(printf '%s\x1f%s\x1f%s' "--remap-path-prefix=$HOME/.cargo/registry/src=/cargo/registry/src" "--remap-path-prefix=$GITHUB_WORKSPACE=." "-Ccodegen-units=1")
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          # Build each ABI in its own gradle invocation so the gradle task graph
          # matches F-Droid (which builds one ABI per metadata entry job).
          flutter build apk --release --split-per-abi --target-platform="android-arm"
          flutter build apk --release --split-per-abi --target-platform="android-arm64"
          flutter build apk --release --split-per-abi --target-platform="android-x64"

      - name: Upload Release Build to Artifacts (unsigned APKs)
        uses: actions/upload-artifact@v7
        with:
          name: gitsync-enhanced-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          draft: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}